<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Flow Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', system-ui; }
    body { background: #0a2540; color: #fff; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-center items-center p-4">

<div class="w-full max-w-md bg-white text-gray-900 rounded-2xl p-6 shadow-2xl">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-black text-[#0a2540]">CASH FLOW BANKING</h1>
    <p class="text-xs text-gray-500 mt-1">Secure Digital Banking</p>
  </div>

  <!-- STATUS ALERT -->
  <div id="alertBox" class="hidden p-3 rounded-xl text-xs font-semibold mb-4 text-center"></div>

  <!-- LOGIN FORM -->
  <div id="loginForm">
    <h2 class="font-bold text-lg mb-3">Sign In</h2>
    <input id="loginEmail" type="email" placeholder="Email Address" class="w-full h-12 border rounded-xl px-4 text-sm mb-3 focus:outline-none focus:border-[#0a2540]">
    <input id="loginPass" type="password" placeholder="Password" class="w-full h-12 border rounded-xl px-4 text-sm mb-4 focus:outline-none focus:border-[#0a2540]">
    <button onclick="loginUser()" class="w-full h-12 bg-[#0a2540] text-white rounded-xl font-bold text-sm">Login</button>
    <p class="text-xs text-center text-gray-500 mt-4">Don't have an account? <a href="#" onclick="toggleAuth(true)" class="text-[#0a2540] font-bold">Register here</a></p>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerForm" class="hidden">
    <h2 class="font-bold text-lg mb-3">Create Account</h2>
    <input id="regName" type="text" placeholder="Full Name" class="w-full h-12 border rounded-xl px-4 text-sm mb-3">
    <input id="regEmail" type="email" placeholder="Email Address" class="w-full h-12 border rounded-xl px-4 text-sm mb-3">
    <input id="regPass" type="password" placeholder="Password" class="w-full h-12 border rounded-xl px-4 text-sm mb-3">
    <input id="regPin" type="password" maxlength="4" placeholder="4-Digit Security PIN" class="w-full h-12 border rounded-xl px-4 text-sm mb-4">
    <button onclick="registerUser()" class="w-full h-12 bg-green-600 text-white rounded-xl font-bold text-sm">Create Account</button>
    <p class="text-xs text-center text-gray-500 mt-4">Already registered? <a href="#" onclick="toggleAuth(false)" class="text-[#0a2540] font-bold">Sign In</a></p>
  </div>

  <!-- USER DASHBOARD -->
  <div id="dashboard" class="hidden text-center">
    <div class="bg-gray-50 p-4 rounded-xl border mb-4">
      <span class="text-xs text-gray-500">Available Balance</span>
      <div class="text-3xl font-black text-green-600 mt-1" id="userBalance">$0.00</div>
    </div>
    <div class="text-left text-xs space-y-2 mb-6">
      <p><b>Account Name:</b> <span id="userName">---</span></p>
      <p><b>Account Number:</b> <span id="userAcc">---</span></p>
      <p><b>Status:</b> <span id="userStatus" class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">APPROVED</span></p>
    </div>
    <button onclick="location.reload()" class="w-full h-11 bg-gray-200 text-gray-800 rounded-xl font-bold text-xs">Log Out</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNQiRLu1xSUc1nNcT_mE0u5-EbysO52y0",
  authDomain: "cash-flow-banking3.firebaseapp.com",
  databaseURL: "https://cash-flow-banking3-default-rtdb.firebaseio.com",
  projectId: "cash-flow-banking3",
  storageBucket: "cash-flow-banking3.firebasestorage.app",
  messagingSenderId: "782707432276",
  appId: "1:782707432276:web:680425b777d227179c86c1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.toggleAuth = (isRegister) => {
  document.getElementById('loginForm').style.display = isRegister ? 'none' : 'block';
  document.getElementById('registerForm').style.display = isRegister ? 'block' : 'none';
  showAlert('');
};

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alertBox');
  if (!msg) { box.classList.add('hidden'); return; }
  box.className = `p-3 rounded-xl text-xs font-semibold mb-4 text-center ${type === 'error' ? 'bg-red-100 text-red-700' : type === 'warning' ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-700'}`;
  box.textContent = msg;
  box.classList.remove('hidden');
}

window.registerUser = async () => {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pass = document.getElementById('regPass').value;
  const pin = document.getElementById('regPin').value;

  if (!name || !email || !pass || !pin) { showAlert('Please fill in all fields.'); return; }

  try {
    const q = query(collection(db, 'cashflow_accounts'), where('email', '==', email));
    const existing = await getDocs(q);
    if (!existing.empty) { showAlert('Email is already registered.'); return; }

    const accNo = '33' + Math.floor(10000000 + Math.random() * 90000000);
    await addDoc(collection(db, 'cashflow_accounts'), {
      name, email, pass, pin, accNo,
      balance: 0,
      status: 'PENDING',
      created: Date.now(),
      history: []
    });

    showAlert('Registration successful! Your account is PENDING approval from the administrator before you can log in.', 'warning');
    toggleAuth(false);
  } catch (err) {
    showAlert('Error: ' + err.message);
  }
};

window.loginUser = async () => {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;

  if (!email || !pass) { showAlert('Enter both email and password.'); return; }

  try {
    const q = query(collection(db, 'cashflow_accounts'), where('email', '==', email));
    const snap = await getDocs(q);

    if (snap.empty) { showAlert('Account not found.'); return; }

    let userData = null;
    snap.forEach(d => userData = d.data());

    if (userData.pass !== pass) { showAlert('Incorrect password.'); return; }

    if (userData.status === 'PENDING') {
      showAlert('Your account registration is still PENDING administrator approval.', 'warning');
      return;
    }

    if (userData.status === 'DECLINED' || userData.status === 'FROZEN') {
      showAlert(`Your account status is ${userData.status}. Access denied.`);
      return;
    }

    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('userName').textContent = userData.name;
    document.getElementById('userAcc').textContent = userData.accNo;
    document.getElementById('userBalance').textContent = '$' + (userData.balance || 0).toLocaleString();
    showAlert('');
  } catch (err) {
    showAlert('Error: ' + err.message);
  }
};
</script>
</body>
</html>

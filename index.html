<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash Flow Banking USA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f8fafc}
#loader{position:fixed;inset:0;background:#0a2540;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.8s}
#loader.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top:3px solid #00ff94;border-radius:50%;animation:spin 1s linear infinite;margin-top:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.header{background:#fff;box-shadow:0 1px 10px rgba(0,0,0,.08);padding:14px 20px;display:flex;justify-content:space-between;position:sticky;top:0}
.brand{font-weight:900;color:#0a2540}.brand span{color:#1e4bd8}
.navbtn{padding:8px 14px;border:1px solid #cbd5e1;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;background:#fff}
.navbtn.active{background:#0a2540;color:#fff}
.hero{background:linear-gradient(105deg,#0a2540,#1e4bd8);color:#fff;padding:30px 20px}
.hero h1{font-size:28px;font-weight:900}.hero p{color:#cbd5e1;font-size:13px;margin:10px 0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:16px auto;max-width:600px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
input{width:100%;height:48px;border:1px solid #cbd5e1;border-radius:12px;padding:0 14px;margin:7px 0}
button.primary{width:100%;height:48px;background:#0a2540;color:#fff;border:0;border-radius:12px;font-weight:800;cursor:pointer;margin-top:6px}
.badge{background:#dcfce7;color:#166534;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800}
</style></head><body>
<div id="loader"><div style="font-size:26px;font-weight:900;color:#fff">💳 CASH FLOW BANKING</div><div class="spinner"></div><div style="color:#94a3b8;font-size:10px;margin-top:12px">Loading secure banking...</div></div>
<div class="header"><div class="brand">CASH FLOW <span>BANKING</span></div><div><button class="navbtn active">Home</button></div></div>
<div class="hero"><h1>Banking That Moves With Your Cash Flow.</h1><p>Open account in 2 minutes, get instant approval, manage funds securely. USA Digital Banking Demo.</p></div>
<div style="display:flex;justify-content:center;gap:8px;margin:14px"><button id="t1" class="navbtn active" onclick="show('create')">Create Account</button><button id="t2" class="navbtn" onclick="show('login')">Login with Account No</button></div>
<div id="create" class="card"><span class="badge">NEW CUSTOMER</span><h3 style="margin:10px 0">Open Account</h3>
<input id="fullname" placeholder="Full Name"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password min 6">
<button class="primary" onclick="createAcc()">Create Account</button><div id="msg" style="margin-top:12px;font-size:13px"></div></div>
<div id="login" class="card" style="display:none"><span class="badge">RETURNING</span><h3 style="margin:10px 0">Login with Account Number</h3>
<input id="lacc" placeholder="Account Number CFB-USA-..."><input id="lpass" type="password" placeholder="Password">
<button class="primary" onclick="login()">Login → Dashboard</button></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCNQiRLu1xSUc1nNcT_mE0u5-EbysO52y0",authDomain:"cash-flow-banking3.firebaseapp.com",projectId:"cash-flow-banking3",storageBucket:"cash-flow-banking3.firebasestorage.app",messagingSenderId:"782707432276",appId:"1:782707432276:web:680425b777d227179c86c1"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
window.addEventListener('load',()=>setTimeout(()=>loader.classList.add('hide'),1200));
window.show=t=>{create.style.display=t=='create'?'block':'none';login.style.display=t=='login'?'block':'none';t1.classList.toggle('active',t=='create');t2.classList.toggle('active',t=='login');}
window.createAcc=async()=>{const n=fullname.value.trim(),e=email.value.toLowerCase().trim(),p=pass.value;if(!n||!e||!p)return alert('Fill all');const ac='CFB-USA-'+Math.floor(100000000+Math.random()*900000000);await addDoc(collection(db,'cashflow_accounts'),{name:n,email:e,pass:p,accNo:ac,status:'PENDING',balance:0,created:Date.now()});msg.innerHTML=`✅ Created!<br><b style="font-size:18px;color:#0a2540">${ac}</b><br>Save this number! Status: PENDING`;fullname.value=email.value=pass.value='';}
window.login=async()=>{const acc=lacc.value.trim().toUpperCase(),p=lpass.value;if(!acc||!p)return alert('Enter details');const q=query(collection(db,'cashflow_accounts'),where('accNo','==',acc),where('pass','==',p));const s=await getDocs(q);if(s.empty)return alert('Wrong Account No or Password');const d=s.docs[0];const data=d.data();if(data.status!='APPROVED')return alert('Not approved yet: '+data.status);localStorage.setItem('cfb_id',d.id);localStorage.setItem('cfb_acc',acc);location.href='dashboard.html';}
</script></body></html>

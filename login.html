<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Cash Flow Bank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-red-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-3">
        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
      </div>
      <h1 class="text-2xl font-bold">Cash Flow Bank</h1>
      <p class="text-gray-500 text-sm mt-1">Login to your account</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Account Number</label>
        <input id="accountNumber" type="text" placeholder="Enter your 10-digit account number"
               class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
               maxlength="10"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
        <input id="password" type="password" placeholder="••••••••"
               class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"/>
      </div>

      <button onclick="login()" id="btn" class="w-full bg-red-600 text-white font-medium py-3.5 rounded-xl hover:bg-red-700 transition">
        Login
      </button>

      <p class="text-sm text-center text-gray-500">
        Don't have an account?
        <a href="register.html" class="text-red-600 font-medium hover:underline">Create one</a>
      </p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCNQiRLu1xSUc1nNcT_mE0u5-EbysO52y0",
      authDomain: "cash-flow-banking3.firebaseapp.com",
      databaseURL: "https://cash-flow-banking3-default-rtdb.firebaseio.com",
      projectId: "cash-flow-banking3",
      storageBucket: "cash-flow-banking3.firebasestorage.app",
      messagingSenderId: "782707432276",
      appId: "1:782707432276:web:680425b777d227179c86c1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    async function login() {
      const accountNumber = document.getElementById('accountNumber').value.trim();
      const password = document.getElementById('password').value;

      if (!accountNumber || !password) {
        return alert('Please enter Account Number and Password');
      }

      if (accountNumber.length !== 10) {
        return alert('Account Number must be 10 digits');
      }

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const snapshot = await db.ref('users').orderByChild('accountNumber').equalTo(accountNumber).once('value');

        if (!snapshot.exists()) {
          alert('Account not found');
          btn.disabled = false;
          btn.textContent = 'Login';
          return;
        }

        let userData = null;
        let userId = null;

        snapshot.forEach(child => {
          userData = child.val();
          userId = child.key;
        });

        if (userData.password !== password) {
          alert('Incorrect password');
          btn.disabled = false;
          btn.textContent = 'Login';
          return;
        }

        if (userData.status === 'pending') {
          alert('Your account is still pending approval. Please wait for admin approval.');
          btn.disabled = false;
          btn.textContent = 'Login';
          return;
        }

        if (userData.status === 'rejected') {
          alert('Your account has been rejected. Please contact support.');
          btn.disabled = false;
          btn.textContent = 'Login';
          return;
        }

        // Save logged in user
        localStorage.setItem('cfb_currentUser', JSON.stringify({
          id: userId,
          name: userData.name,
          email: userData.email,
          phone: userData.phone,
          accountNumber: userData.accountNumber,
          accountType: userData.accountType,
          balance: userData.balance || 0
        }));

        // Redirect to dashboard
        window.location.href = 'dashboard.html';

      } catch (error) {
        console.error(error);
        alert('Login failed: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }
  </script>
</body>
</html>

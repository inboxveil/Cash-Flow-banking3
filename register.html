<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — Cash Flow Bank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-red-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-3">
        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
      </div>
      <h1 class="text-2xl font-bold">Cash Flow Bank</h1>
      <p class="text-gray-500 text-sm mt-1">Create your account</p>
    </div>

    <div id="formBox" class="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
      
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Full Name</label>
        <input id="name" type="text" placeholder="John Doe" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
        <input id="email" type="email" placeholder="john@email.com" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Phone Number</label>
        <input id="phone" type="tel" placeholder="+234 801 234 5678" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"/>
      </div>

      <!-- Account Type -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Account Type</label>
        <select id="accountType" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
          <option value="">Select account type</option>
          <option value="Savings">Savings Account</option>
          <option value="Current">Current Account</option>
          <option value="Business">Business Account</option>
          <option value="Student">Student Account</option>
          <option value="Joint">Joint Account</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
        <input id="password" type="password" placeholder="••••••••" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Confirm Password</label>
        <input id="confirm" type="password" placeholder="••••••••" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"/>
      </div>

      <button onclick="createAccount()" id="btn" class="w-full bg-red-600 text-white font-medium py-3.5 rounded-xl hover:bg-red-700 transition">
        Create Account
      </button>

      <p class="text-xs text-center text-gray-400">After creating, wait for admin approval before you can login.</p>
    </div>

    <!-- Success -->
    <div id="successBox" class="hidden bg-white rounded-2xl shadow-sm border p-8 text-center">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
      </div>
      <h2 class="text-xl font-bold mb-2">Account Created!</h2>
      <p class="text-gray-500 text-sm mb-3">Your request has been sent for approval.</p>
      <p class="text-sm font-medium">Your Account Number:</p>
      <p id="generatedAcc" class="text-lg font-bold text-red-600 mt-1"></p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCNQiRLu1xSUc1nNcT_mE0u5-EbysO52y0",
      authDomain: "cash-flow-banking3.firebaseapp.com",
      databaseURL: "https://cash-flow-banking3-default-rtdb.firebaseio.com",
      projectId: "cash-flow-banking3",
      storageBucket: "cash-flow-banking3.firebasestorage.app",
      messagingSenderId: "782707432276",
      appId: "1:782707432276:web:680425b777d227179c86c1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Generate a 10-digit account number (counter style)
    function generateAccountNumber() {
      // Starts from 1000000001 and uses timestamp to make it unique
      const base = 1000000000;
      const random = Math.floor(Math.random() * 900000000) + 1;
      return String(base + random).slice(0, 10);
    }

    async function createAccount() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const phone = document.getElementById('phone').value.trim();
      const accountType = document.getElementById('accountType').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (!name || !email || !phone || !accountType || !password) {
        return alert('Please fill all fields');
      }
      if (password !== confirm) {
        return alert('Passwords do not match');
      }
      if (password.length < 6) {
        return alert('Password must be at least 6 characters');
      }

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        // Check if email already exists
        const snapshot = await db.ref('users').orderByChild('email').equalTo(email).once('value');
        if (snapshot.exists()) {
          alert('This email is already registered');
          btn.disabled = false;
          btn.textContent = 'Create Account';
          return;
        }

        const accountNumber = generateAccountNumber();

        const newUserRef = db.ref('users').push();
        await newUserRef.set({
          name,
          email,
          phone,
          accountType,
          accountNumber,
          password,
          status: 'pending',
          balance: 0,
          createdAt: new Date().toISOString()
        });

        document.getElementById('formBox').classList.add('hidden');
        document.getElementById('successBox').classList.remove('hidden');
        document.getElementById('generatedAcc').textContent = accountNumber;

      } catch (error) {
        console.error(error);
        alert('Error: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>

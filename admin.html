<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash Flow Banking - ADMIN ONLY</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f172a;color:#fff;padding:14px}
.card{background:#fff;color:#0f172a;border-radius:16px;padding:20px;margin-top:16px;max-width:900px}
input{width:100%;height:48px;padding:0 14px;border:1px solid #cbd5e1;border-radius:12px;margin:8px 0}
button{height:42px;padding:0 18px;border:0;border-radius:10px;background:#1e4bd8;color:#fff;font-weight:800;cursor:pointer;margin:4px}
button.green{background:#00b050}button.red{background:#e11d48}button.gray{background:#e2e8f0;color:#111}
.acc{border:1px solid #e2e8f0;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style></head><body>
<h2>🔒 Cash Flow Banking - ADMIN PANEL</h2><p style="font-size:12px;color:#94a3b8;margin-top:6px">Secret link - only admin sabi this page. PIN: admin123</p>
<div class="card">
<input id="pin" type="password" placeholder="Enter Admin PIN: admin123"><button onclick="unlock()">Unlock Admin Dashboard</button>
<div id="area" style="display:none;margin-top:16px">
<div style="display:flex;gap:12px;font-size:13px;margin-bottom:12px"><div>Total: <b id="t">0</b></div><div>Pending: <b id="p" style="color:orange">0</b></div><div>Approved: <b id="a" style="color:green">0</b></div></div>
<div id="list"></div><button class="gray" onclick="load()">Refresh</button>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCNQiRLu1xSUc1nNcT_mE0u5-EbysO52y0",
  authDomain: "cash-flow-banking3.firebaseapp.com",
  projectId: "cash-flow-banking3",
  storageBucket: "cash-flow-banking3.firebasestorage.app",
  messagingSenderId: "782707432276",
  appId: "1:782707432276:web:680425b777d227179c86c1"
};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
window.unlock=()=>{if(pin.value!=='admin123')return alert('Wrong PIN');area.style.display='block';load();}
window.load=async()=>{const s=await getDocs(collection(db,'cashflow_accounts'));t.textContent=s.size;let pend=0,appr=0;s.forEach(d=>{if(d.data().status=='PENDING')pend++;if(d.data().status=='APPROVED')appr++;});p.textContent=pend;a.textContent=appr;let h='';s.docs.sort((x,y)=>y.data().created-x.data().created).forEach(d=>{const c=d.data();h+=`<div class="acc"><div><b>${c.name}</b><br><small>${c.email} | ${c.accNo} | $${c.balance} | <b style="color:${c.status=='PENDING'?'orange':c.status=='APPROVED'?'green':'red'}">${c.status}</b></small></div><div>${c.status=='PENDING'?`<button class="green" onclick="appv('${d.id}')">Approve</button><button class="red" onclick="dec('${d.id}')">Decline</button>`:`<button class="gray" onclick="del('${d.id}')">Delete</button>`}</div></div>`});list.innerHTML=h||'No users yet';}
window.appv=async(id)=>{await updateDoc(doc(db,'cashflow_accounts',id),{status:'APPROVED'});load();}
window.dec=async(id)=>{await updateDoc(doc(db,'cashflow_accounts',id),{status:'DECLINED'});load();}
window.del=async(id)=>{if(confirm('Delete?')){await deleteDoc(doc(db,'cashflow_accounts',id));load();}}
</script></body></html>

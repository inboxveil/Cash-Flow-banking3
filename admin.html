<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cash Flow — Admin Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <div class="max-w-4xl mx-auto min-h-screen p-4 pb-12 flex flex-col justify-between">

    <!-- HEADER -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center text-white font-bold shadow-lg shadow-red-600/30">
          <i class="fa-solid fa-user-shield text-lg"></i>
        </div>
        <div>
          <h1 class="font-black text-lg tracking-wider text-white uppercase">Admin Console</h1>
          <p class="text-xs text-slate-400">Cash Flow Management System</p>
        </div>
      </div>

      <div id="admin-session-controls" class="hidden">
        <button onclick="handleAdminLogout()" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-red-400 hover:text-red-300 hover:bg-slate-800 transition flex items-center gap-1.5">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Logout</span>
        </button>
      </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1">

      <!-- ADMIN LOGIN VIEW -->
      <div id="admin-login-view" class="max-w-md mx-auto my-12 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
        <div class="text-center">
          <div class="w-12 h-12 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-400 flex items-center justify-center mx-auto mb-3 text-xl">
            <i class="fa-solid fa-lock"></i>
          </div>
          <h2 class="text-xl font-bold text-white">Administrator Access</h2>
          <p class="text-xs text-slate-400 mt-1">Sign in to manage pending user approvals.</p>
        </div>

        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Admin Email</label>
            <input type="email" id="admin-email" required value="admin@cashflow.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Password</label>
            <input type="password" id="admin-password" required value="admin123" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
          </div>

          <button type="submit" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-semibold rounded-xl shadow-lg shadow-red-600/30 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-key text-xs"></i>
            <span>Authenticate Admin</span>
          </button>
        </form>
      </div>

      <!-- ADMIN DASHBOARD VIEW -->
      <div id="admin-dashboard-view" class="space-y-6 hidden">

        <!-- STATS CARDS -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider">Pending Approvals</span>
              <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center text-sm">
                <i class="fa-solid fa-clock-rotate-left"></i>
              </div>
            </div>
            <p id="stat-pending" class="text-2xl font-black text-white mt-2">0</p>
          </div>

          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Active Users</span>
              <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-sm">
                <i class="fa-solid fa-user-check"></i>
              </div>
            </div>
            <p id="stat-active" class="text-2xl font-black text-white mt-2">0</p>
          </div>

          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-blue-400 uppercase tracking-wider">Total Accounts</span>
              <div class="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center text-sm">
                <i class="fa-solid fa-users"></i>
              </div>
            </div>
            <p id="stat-total" class="text-2xl font-black text-white mt-2">0</p>
          </div>
        </div>

        <!-- SECTION: PENDING USER REQUESTS -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
              <i class="fa-solid fa-user-clock text-amber-400"></i>
              <span>Pending Account Requests</span>
            </h2>
            <span id="pending-count-badge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">0 Pending</span>
          </div>

          <div id="pending-users-list" class="space-y-3">
            <!-- Dynamic pending users inserted here -->
          </div>
        </div>

        <!-- SECTION: ALL USER ACCOUNTS -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
              <i class="fa-solid fa-users-gear text-blue-400"></i>
              <span>All Registered Accounts</span>
            </h2>
          </div>

          <div id="all-users-list" class="space-y-3">
            <!-- Dynamic active users inserted here -->
          </div>
        </div>

      </div>

    </main>

    <!-- FOOTER -->
    <footer class="mt-8 text-center text-xs text-slate-600 border-t border-slate-900 pt-4">
      Cash Flow Financial Systems — Admin Portal
    </footer>

  </div>

  <!-- JS LOGIC -->
  <script>
    const ADMIN_EMAIL = "admin@cashflow.com";
    const ADMIN_PASS = "admin123";

    document.addEventListener('DOMContentLoaded', () => {
      checkAdminSession();
    });

    function getUsersDB() {
      return JSON.parse(localStorage.getItem('cf_users_db') || '{}');
    }

    function saveUsersDB(db) {
      localStorage.setItem('cf_users_db', JSON.stringify(db));
    }

    function checkAdminSession() {
      const isAdminLoggedIn = sessionStorage.getItem('cf_admin_auth') === 'true';
      if (isAdminLoggedIn) {
        showAdminDashboard();
      } else {
        showAdminLogin();
      }
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;

      if (email === ADMIN_EMAIL && password === ADMIN_PASS) {
        sessionStorage.setItem('cf_admin_auth', 'true');
        showAdminDashboard();
      } else {
        alert('Invalid Admin Credentials!');
      }
    }

    function handleAdminLogout() {
      sessionStorage.removeItem('cf_admin_auth');
      showAdminLogin();
    }

    function showAdminLogin() {
      document.getElementById('admin-login-view').classList.remove('hidden');
      document.getElementById('admin-dashboard-view').classList.add('hidden');
      document.getElementById('admin-session-controls').classList.add('hidden');
    }

    function showAdminDashboard() {
      document.getElementById('admin-login-view').classList.add('hidden');
      document.getElementById('admin-dashboard-view').classList.remove('hidden');
      document.getElementById('admin-session-controls').classList.remove('hidden');

      renderAdminData();
    }

    function renderAdminData() {
      const users = getUsersDB();
      const userArray = Object.values(users);

      const pendingUsers = userArray.filter(u => u.status === 'pending');
      const activeUsers = userArray.filter(u => u.status === 'approved' || !u.status);

      // Render Counters
      document.getElementById('stat-pending').innerText = pendingUsers.length;
      document.getElementById('stat-active').innerText = activeUsers.length;
      document.getElementById('stat-total').innerText = userArray.length;
      document.getElementById('pending-count-badge').innerText = `${pendingUsers.length} Pending`;

      // Render Pending List
      const pendingContainer = document.getElementById('pending-users-list');
      pendingContainer.innerHTML = '';

      if (pendingUsers.length === 0) {
        pendingContainer.innerHTML = `
          <div class="p-6 text-center text-slate-500 text-xs">
            <i class="fa-solid fa-circle-check text-emerald-500 text-xl mb-2 block"></i>
            No pending account requests found. All clear!
          </div>
        `;
      } else {
        pendingUsers.forEach(user => {
          const card = document.createElement('div');
          card.className = "p-4 bg-slate-950 border border-slate-800 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3";
          card.innerHTML = `
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-white text-sm">${user.name}</h3>
                <span class="text-[10px] font-semibold text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded-full border border-blue-500/20">${user.accountType || 'Savings'}</span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">${user.email}</p>
              <p class="text-[10px] text-slate-500 font-mono mt-1">ACC NUM: ${user.accountNumber || 'Pending'}</p>
            </div>

            <div class="flex items-center gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-900">
              <button onclick="approveUser('${user.email}')" class="flex-1 sm:flex-initial px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg text-xs transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-check"></i>
                <span>Approve</span>
              </button>
              <button onclick="rejectUser('${user.email}')" class="flex-1 sm:flex-initial px-4 py-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white font-semibold rounded-lg text-xs transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-xmark"></i>
                <span>Reject</span>
              </button>
            </div>
          `;
          pendingContainer.appendChild(card);
        });
      }

      // Render Active Users List
      const allUsersContainer = document.getElementById('all-users-list');
      allUsersContainer.innerHTML = '';

      if (userArray.length === 0) {
        allUsersContainer.innerHTML = `<div class="p-4 text-center text-slate-500 text-xs">No registered accounts present in database.</div>`;
      } else {
        userArray.forEach(user => {
          const isPending = user.status === 'pending';
          const card = document.createElement('div');
          card.className = "p-3.5 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between";
          card.innerHTML = `
            <div>
              <div class="flex items-center gap-2">
                <p class="font-bold text-xs text-white">${user.name}</p>
                <span class="text-[9px] font-bold uppercase px-2 py-0.5 rounded ${isPending ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">
                  ${isPending ? 'Pending' : 'Active'}
                </span>
              </div>
              <p class="text-[11px] text-slate-400">${user.email}</p>
            </div>

            <div class="text-right">
              <p class="text-xs font-black text-white">$${(user.balance || 0).toLocaleString('en-US', { minimumFractionDigits: 2 })}</p>
              <button onclick="deleteAccount('${user.email}')" class="text-[10px] text-red-400 hover:underline mt-0.5">Delete User</button>
            </div>
          `;
          allUsersContainer.appendChild(card);
        });
      }
    }

    function approveUser(email) {
      const users = getUsersDB();
      if (users[email]) {
        users[email].status = 'approved';
        saveUsersDB(users);
        renderAdminData();
        alert(`Account for ${users[email].name} has been approved.`);
      }
    }

    function rejectUser(email) {
      if (confirm(`Are you sure you want to reject and remove this account application?`)) {
        deleteAccount(email);
      }
    }

    function deleteAccount(email) {
      const users = getUsersDB();
      if (users[email]) {
        delete users[email];
        saveUsersDB(users);
        renderAdminData();
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://cdn.tailwindcss.com"></script>
<title>Admin</title>
</head>
<body class="bg-gray-100">
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow">
<h1 class="font-bold">Admin</h1>
<input
  id="email"
  placeholder="user email"
  class="w-full border p-2 rounded mb-2"
/>
<input
  id="amount"
  type="number"
  placeholder="amount"
  class="w-full border p-2 rounded mb-2"
/>
<button
  onclick="alert('Saved Adjustment for '+email.value+' — $'+amount.value)"
  class="w-full bg-black text-white py-2 rounded"
>
  Save Adjustment
</button>
<a href="index.html" class="text-xs underline block mt-4">
  Back to Dashboard
</a>
</div>
</body>
</html>

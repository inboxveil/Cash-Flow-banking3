<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel — Cash Flow Bank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen" x-data="adminApp()" x-init="loadUsers()">

  <!-- Header -->
  <header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-red-600 rounded-lg flex items-center justify-center text-white">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
        </div>
        <div>
          <h1 class="font-bold text-lg">Admin Panel</h1>
          <p class="text-xs text-gray-500">Cash Flow Bank</p>
        </div>
      </div>
      <button @click="loadUsers()" class="text-sm text-red-600 font-medium hover:underline">Refresh</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-4 mb-8">
      <div class="bg-white rounded-2xl p-5 shadow-sm border text-center">
        <p class="text-3xl font-bold text-yellow-600" x-text="pendingCount"></p>
        <p class="text-sm text-gray-500 mt-1">Pending</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border text-center">
        <p class="text-3xl font-bold text-green-600" x-text="approvedCount"></p>
        <p class="text-sm text-gray-500 mt-1">Approved</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border text-center">
        <p class="text-3xl font-bold text-gray-700" x-text="users.length"></p>
        <p class="text-sm text-gray-500 mt-1">Total Users</p>
      </div>
    </div>

    <!-- Pending Requests -->
    <div class="mb-10">
      <h2 class="text-lg font-semibold mb-4">Pending Approvals</h2>

      <div x-show="pendingUsers.length === 0" class="bg-white rounded-2xl p-10 text-center border shadow-sm">
        <p class="text-gray-400">No pending requests</p>
      </div>

      <div class="space-y-3">
        <template x-for="user in pendingUsers" :key="user.id">
          <div class="bg-white rounded-2xl p-5 shadow-sm border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <p class="font-semibold" x-text="user.name"></p>
              <p class="text-sm text-gray-500" x-text="user.email"></p>
              <p class="text-sm text-gray-500" x-text="user.phone"></p>
              <p class="text-xs text-gray-400 mt-1" x-text="'Requested: ' + new Date(user.createdAt).toLocaleString()"></p>
            </div>
            <div class="flex gap-2">
              <button @click="approve(user.id)"
                      class="bg-green-600 text-white px-5 py-2 rounded-xl text-sm font-medium hover:bg-green-700 transition">
                Approve
              </button>
              <button @click="reject(user.id)"
                      class="bg-red-100 text-red-600 px-5 py-2 rounded-xl text-sm font-medium hover:bg-red-200 transition">
                Reject
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- All Users -->
    <div>
      <h2 class="text-lg font-semibold mb-4">All Users</h2>
      <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-left">
              <tr>
                <th class="px-5 py-3 font-medium">Name</th>
                <th class="px-5 py-3 font-medium">Email</th>
                <th class="px-5 py-3 font-medium">Phone</th>
                <th class="px-5 py-3 font-medium">Status</th>
                <th class="px-5 py-3 font-medium">Date</th>
                <th class="px-5 py-3 font-medium">Action</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              <template x-for="user in users" :key="user.id">
                <tr>
                  <td class="px-5 py-3.5 font-medium" x-text="user.name"></td>
                  <td class="px-5 py-3.5 text-gray-600" x-text="user.email"></td>
                  <td class="px-5 py-3.5 text-gray-600" x-text="user.phone"></td>
                  <td class="px-5 py-3.5">
                    <span class="text-xs px-2.5 py-1 rounded-full font-medium"
                          :class="{
                            'bg-yellow-100 text-yellow-700': user.status === 'pending',
                            'bg-green-100 text-green-700': user.status === 'approved',
                            'bg-red-100 text-red-700': user.status === 'rejected'
                          }"
                          x-text="user.status"></span>
                  </td>
                  <td class="px-5 py-3.5 text-gray-500 text-xs" x-text="new Date(user.createdAt).toLocaleDateString()"></td>
                  <td class="px-5 py-3.5">
                    <button x-show="user.status === 'approved'" @click="revoke(user.id)"
                            class="text-xs text-red-600 hover:underline">Revoke</button>
                    <button x-show="user.status === 'rejected'" @click="approve(user.id)"
                            class="text-xs text-green-600 hover:underline">Re-approve</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    function adminApp() {
      return {
        users: [],

        get pendingUsers() {
          return this.users.filter(u => u.status === 'pending');
        },
        get pendingCount() {
          return this.pendingUsers.length;
        },
        get approvedCount() {
          return this.users.filter(u => u.status === 'approved').length;
        },

        loadUsers() {
          this.users = JSON.parse(localStorage.getItem('cfb_users') || '[]');
        },

        save() {
          localStorage.setItem('cfb_users', JSON.stringify(this.users));
          this.loadUsers();
        },

        approve(id) {
          const user = this.users.find(u => u.id === id);
          if (user) {
            user.status = 'approved';
            user.balance = 1000; // Starting bonus balance
            this.save();
            alert(user.name + ' has been approved!');
          }
        },

        reject(id) {
          if (!confirm('Reject this user?')) return;
          const user = this.users.find(u => u.id === id);
          if (user) {
            user.status = 'rejected';
            this.save();
          }
        },

        revoke(id) {
          if (!confirm('Revoke access for this user?')) return;
          const user = this.users.find(u => u.id === id);
          if (user) {
            user.status = 'rejected';
            this.save();
          }
        }
      }
    }
  </script>
</body>
</html>

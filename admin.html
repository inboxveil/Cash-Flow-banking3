<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Cashflow Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>* { font-family: 'Inter', system-ui; } body { background: #f4f6f9; }</style>
</head>
<body class="antialiased">

<header class="bg-[#0a2540] text-white h-[60px] flex items-center px-4 sticky top-0 z-20">
  <div class="font-black">CASHFLOW BANK ADMIN</div>
</header>

<!-- LOGIN VIEW -->
<div id="loginView" class="max-w-[400px] mx-auto mt-20 bg-white rounded-[20px] p-6 shadow">
  <h3 class="font-bold text-lg">Admin Login</h3>
  <input id="adminPass" type="password" placeholder="Admin Password" class="w-full h-12 border rounded-xl px-4 mt-4 text-sm">
  <button onclick="adminLogin()" class="w-full h-12 bg-[#0a2540] text-white rounded-xl font-bold mt-3 text-sm">Access Control Panel</button>
  <div id="loginMsg" class="text-xs mt-2 text-red-600"></div>
</div>

<!-- MAIN ADMIN PANEL -->
<div id="adminView" style="display:none" class="max-w-[1000px] mx-auto p-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="font-black text-xl text-[#0a2540]">Accounts Management</h2>
    <button onclick="loadAccounts()" class="bg-[#0a2540] text-white text-xs px-4 py-2 rounded-full font-bold">Refresh Data</button>
  </div>
  <div class="bg-white rounded-[16px] shadow overflow-hidden">
    <div id="accList" class="divide-y"></div>
  </div>
</div>

<!-- EDIT / FUND & BLOCK RULE MODAL -->
<div id="fundModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
    <h3 class="font-black text-lg text-[#0a2540]">Fund & Hold Rule Controls</h3>
    <p id="modalUser" class="text-xs text-gray-500 mt-1 mb-4"></p>
    
    <!-- BALANCES SECTION -->
    <div class="border-t pt-3 mb-3">
      <span class="block text-xs font-black text-[#0a2540] uppercase tracking-wider mb-2">1. Account Balances</span>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-[10px] font-bold text-gray-600 mb-1">Checking ($)</label>
          <input id="modalChecking" type="number" step="any" class="w-full h-10 border rounded-xl px-3 text-xs focus:outline-none focus:border-[#0a2540]">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-600 mb-1">Savings ($)</label>
          <input id="modalSavings" type="number" step="any" class="w-full h-10 border rounded-xl px-3 text-xs focus:outline-none focus:border-[#0a2540]">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-600 mb-1">Investment ($)</label>
          <input id="modalInvestment" type="number" step="any" class="w-full h-10 border rounded-xl px-3 text-xs focus:outline-none focus:border-[#0a2540]">
        </div>
      </div>
    </div>

    <!-- HOLD & BLOCK RULE SECTION -->
    <div class="border-t pt-3 mb-4">
      <span class="block text-xs font-black text-red-600 uppercase tracking-wider mb-2">2. Custom Block / Clearance Prompts</span>
      
      <label class="block text-xs font-bold text-gray-700 mb-1">Account Status</label>
      <select id="modalStatus" class="w-full h-10 border rounded-xl px-3 text-xs mb-3 bg-white">
        <option value="APPROVED">APPROVED</option>
        <option value="PENDING">PENDING</option>
        <option value="DECLINED">DECLINED</option>
        <option value="FROZEN">FROZEN (Account On-Hold)</option>
      </select>

      <label class="block text-xs font-bold text-gray-700 mb-1">Custom Hold Reason / Notice Message</label>
      <textarea id="modalHoldReason" rows="2" placeholder="e.g. AML Anti-Money Laundering verification required. Settle Tax Clearance Fee to unfreeze." class="w-full border rounded-xl p-3 text-xs mb-3 focus:outline-none focus:border-[#0a2540]"></textarea>

      <label class="block text-xs font-bold text-gray-700 mb-1">Required Clearance / Tax Fee ($)</label>
      <input id="modalClearanceFee" type="number" step="any" placeholder="0.00" class="w-full h-10 border rounded-xl px-3 text-xs mb-4 focus:outline-none focus:border-[#0a2540]">
    </div>

    <div class="flex gap-2">
      <button onclick="saveFunding()" class="flex-1 h-12 bg-green-600 text-white rounded-xl font-bold text-sm">Save Changes</button>
      <button onclick="closeModal()" class="flex-1 h-12 bg-gray-100 text-gray-700 rounded-xl font-bold text-sm">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNQiRLu1xSUc1nNcT_mE0u5-EbysO52y0",
  authDomain: "cash-flow-banking3.firebaseapp.com",
  databaseURL: "https://cash-flow-banking3-default-rtdb.firebaseio.com",
  projectId: "cash-flow-banking3",
  storageBucket: "cash-flow-banking3.firebasestorage.app",
  messagingSenderId: "782707432276",
  appId: "1:782707432276:web:680425b777d227179c86c1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let currentEditingId = null;

window.adminLogin = () => {
  const pass = document.getElementById('adminPass').value;
  if (pass === 'admin123') {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('adminView').style.display = 'block';
    loadAccounts();
  } else {
    document.getElementById('loginMsg').textContent = 'Incorrect password! (Default: admin123)';
  }
};

async function loadAccounts() {
  const snap = await getDocs(collection(db, 'cashflow_accounts'));
  let html = '';
  snap.forEach(d => {
    const acc = d.data();
    const id = d.id;
    const badgeColor = acc.status === 'APPROVED' ? 'bg-green-100 text-green-700' : acc.status === 'PENDING' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700';

    const checkBal = acc.checkingBalance || acc.balance || 0;
    const saveBal = acc.savingsBalance || 0;
    const invBal = acc.investmentBalance || 0;

    html += `<div class="p-4 flex flex-col md:flex-row justify-between md:items-center gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-sm">${acc.name}</span>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}">${acc.status}</span>
        </div>
        <div class="text-xs text-gray-500 mt-1">Acc No: <b class="text-[#0a2540] font-mono">${acc.accNo}</b> • Email: ${acc.email} • Pass: <b>${acc.pass}</b></div>
        ${acc.holdReason ? `<div class="text-[11px] text-red-600 font-bold mt-1">⚠️ Notice: "${acc.holdReason}" ${acc.clearanceFee ? `(Fee: $${acc.clearanceFee})` : ''}</div>` : ''}
        <div class="text-xs font-extrabold gap-3 flex mt-2">
          <span class="text-green-700">Check: $${checkBal.toLocaleString()}</span>
          <span class="text-indigo-700">Save: $${saveBal.toLocaleString()}</span>
          <span class="text-amber-700">Invest: $${invBal.toLocaleString()}</span>
        </div>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button onclick="openModal('${id}', '${acc.name}', ${checkBal}, ${saveBal}, ${invBal}, '${acc.status}', '${(acc.holdReason || '').replace(/'/g, "\\'")}', ${acc.clearanceFee || 0})" class="px-3 py-1.5 bg-[#0a2540] text-white rounded-lg text-xs font-bold">Fund / Hold Rules</button>
        <button onclick="setStatus('${id}', 'APPROVED')" class="px-3 py-1.5 bg-green-600 text-white rounded-lg text-xs font-bold">Approve</button>
        <button onclick="setStatus('${id}', 'DECLINED')" class="px-3 py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold">Decline</button>
      </div>
    </div>`;
  });
  document.getElementById('accList').innerHTML = html || '<div class="p-6 text-center text-xs text-gray-400">No registered accounts yet.</div>';
}

window.setStatus = async (id, status) => {
  await updateDoc(doc(db, 'cashflow_accounts', id), { status });
  loadAccounts();
};

window.openModal = (id, name, checkBal, saveBal, invBal, currentStatus, holdReason, clearanceFee) => {
  currentEditingId = id;
  document.getElementById('modalUser').textContent = `Account Holder: ${name}`;
  document.getElementById('modalChecking').value = checkBal;
  document.getElementById('modalSavings').value = saveBal;
  document.getElementById('modalInvestment').value = invBal;
  document.getElementById('modalStatus').value = currentStatus;
  document.getElementById('modalHoldReason').value = holdReason || '';
  document.getElementById('modalClearanceFee').value = clearanceFee || 0;
  document.getElementById('fundModal').classList.remove('hidden');
  document.getElementById('fundModal').classList.add('flex');
};

window.closeModal = () => {
  currentEditingId = null;
  document.getElementById('fundModal').classList.add('hidden');
  document.getElementById('fundModal').classList.remove('flex');
};

window.saveFunding = async () => {
  if (!currentEditingId) return;
  const cBal = parseFloat(document.getElementById('modalChecking').value) || 0;
  const sBal = parseFloat(document.getElementById('modalSavings').value) || 0;
  const iBal = parseFloat(document.getElementById('modalInvestment').value) || 0;
  const newStatus = document.getElementById('modalStatus').value;
  const holdReason = document.getElementById('modalHoldReason').value.trim();
  const clearanceFee = parseFloat(document.getElementById('modalClearanceFee').value) || 0;

  await updateDoc(doc(db, 'cashflow_accounts', currentEditingId), {
    checkingBalance: cBal,
    savingsBalance: sBal,
    investmentBalance: iBal,
    balance: cBal,
    status: newStatus,
    holdReason: holdReason,
    clearanceFee: clearanceFee
  });

  closeModal();
  loadAccounts();
};

window.loadAccounts = loadAccounts;
</script>
</body>
</html>

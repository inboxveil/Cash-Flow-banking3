<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash Flow Banking - ADMIN ONLY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f172a;color:#fff;padding:14px}
.card{background:#fff;color:#0f172a;border-radius:16px;padding:20px;margin-top:16px;max-width:1000px}
input{width:100%;height:44px;padding:0 12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0}
button{height:40px;padding:0 14px;border:0;border-radius:8px;background:#1e4bd8;color:#fff;font-weight:800;cursor:pointer;margin:3px;font-size:12px}
button.green{background:#00b050}button.red{background:#e11d48}button.gray{background:#e2e8f0;color:#111}button.orange{background:#f59e0b;color:#000}
.acc{border:1px solid #e2e8f0;padding:14px;border-radius:12px;margin:8px 0}
.fundBox{background:#f8fafc;border:1px dashed #94a3b8;padding:10px;border-radius:10px;margin-top:8px;display:none}
</style></head><body>
<h2>🔒 Cash Flow Banking - ADMIN PANEL</h2><p style="font-size:11px;color:#94a3b8;margin-top:6px">Secret - PIN: admin123 | You go fund accounts here</p>
<div class="card">
<input id="pin" type="password" placeholder="Enter Admin PIN: admin123"><button onclick="unlock()">Unlock Admin Dashboard</button>
<div id="area" style="display:none;margin-top:16px">
<div style="display:flex;gap:10px;font-size:12px;margin-bottom:12px;flex-wrap:wrap"><div>Total: <b id="t">0</b></div><div>Pending: <b id="p" style="color:orange">0</b></div><div>Approved: <b id="a" style="color:green">0</b></div><div>Total Fake Funds: $<b id="tf">0</b></div></div>
<input id="search" placeholder="Search by name, email or account number CFB-USA-..." onkeyup="filterList()">
<div id="list"></div><button class="gray" onclick="load()">Refresh</button>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCNQiRLu1xSUc1nNcT_mE0u5-EbysO52y0",authDomain:"cash-flow-banking3.firebaseapp.com",projectId:"cash-flow-banking3",storageBucket:"cash-flow-banking3.firebasestorage.app",messagingSenderId:"782707432276",appId:"1:782707432276:web:680425b777d227179c86c1"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
let allDocs=[];
window.unlock=()=>{if(pin.value!=='admin123')return alert('Wrong PIN');area.style.display='block';load();}
window.load=async()=>{const s=await getDocs(collection(db,'cashflow_accounts'));allDocs=s.docs;render(allDocs)}
function render(docs){
let totalFunds=0;let pend=0,appr=0;
docs.forEach(d=>{totalFunds+=d.data().balance||0;if(d.data().status=='PENDING')pend++;if(d.data().status=='APPROVED')appr++;});
t.textContent=docs.length;p.textContent=pend;a.textContent=appr;tf.textContent=totalFunds.toLocaleString();
let h='';docs.sort((x,y)=>y.data().created-x.data().created).forEach(d=>{const c=d.data();h+=`<div class="acc"><div><b>${c.name}</b> - <small>${c.email}</small><br><small><b>${c.accNo}</b> | Balance: <b style="color:#1e4bd8">$${c.balance}</b> | <b style="color:${c.status=='PENDING'?'orange':c.status=='APPROVED'?'green':'red'}">${c.status}</b></small></div>
<div style="margin-top:6px">
${c.status=='PENDING'?`<button class="green" onclick="appv('${d.id}')">Approve</button><button class="red" onclick="dec('${d.id}')">Decline</button>`:`<button class="orange" onclick="toggleFund('${d.id}')">💰 Fund Account</button><button class="gray" onclick="del('${d.id}')">Delete</button>`}
<div id="fund-${d.id}" class="fundBox"><input id="amt-${d.id}" type="number" placeholder="Amount to add e.g 5000"><button class="green" onclick="fundAcc('${d.id}')">Add Funds</button><button class="gray" onclick="toggleFund('${d.id}')">Cancel</button></div>
</div></div>`});list.innerHTML=h||'No users';}
window.toggleFund=id=>{const el=document.getElementById('fund-'+id);el.style.display=el.style.display=='block'?'none':'block';}
window.fundAcc=async id=>{
const amtInput=document.getElementById('amt-'+id);const a=parseFloat(amtInput.value);
if(!a||a<=0)return alert('Enter valid amount');
const docRef=doc(db,'cashflow_accounts',id);
const target=allDocs.find(d=>d.id===id);const oldBal=target.data().balance||0;const newBal=oldBal+a;
await updateDoc(docRef,{balance:newBal});
alert(`✅ Funded $${a} to ${target.data().name} (${target.data().accNo})\nOld: $${oldBal} → New: $${newBal} DEMO`);
load();
}
window.filterList=()=>{const q=search.value.toLowerCase();const filtered=allDocs.filter(d=>{const c=d.data();return c.name.toLowerCase().includes(q)||c.email.toLowerCase().includes(q)||c.accNo.toLowerCase().includes(q)});render(filtered);}
window.appv=async id=>{await updateDoc(doc(db,'cashflow_accounts',id),{status:'APPROVED'});load();}
window.dec=async id=>{await updateDoc(doc(db,'cashflow_accounts',id),{status:'DECLINED'});load();}
window.del=async id=>{if(confirm('Delete this account?')){await deleteDoc(doc(db,'cashflow_accounts',id));load();}}
</script></body></html>

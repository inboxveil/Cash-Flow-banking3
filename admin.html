<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Trust Bank - Admin Control Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    body { background: #060e1e; color: #1e293b; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #060e1e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-center items-center p-2 sm:p-4 md:p-6 relative">

  <!-- MAIN CONTAINER -->
  <div class="w-full max-w-md bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-slate-200/60 mb-12 relative">

    <!-- TOP HEADER -->
    <div class="bg-gradient-to-r from-slate-900 via-[#0b1b36] to-slate-900 p-6 text-white text-center relative flex items-center justify-between border-b border-slate-800">
      <div class="w-10"></div>
      <div class="flex items-center justify-center gap-2.5 mx-auto">
        <div class="w-8 h-8 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center font-black text-white text-base shadow-lg shadow-cyan-500/30">AT</div>
        <h1 class="text-base font-extrabold tracking-tight">ADMIN PORTAL</h1>
      </div>
      <div class="w-10"></div>
    </div>

    <!-- GLOBAL STATUS ALERT -->
    <div class="px-6 pt-4">
      <div id="alertBox" class="hidden p-3.5 rounded-2xl text-xs font-semibold text-center border shadow-sm"></div>
    </div>

    <!-- VIEW: ADMIN LOGIN -->
    <div id="adminLoginView" class="p-6 pt-3">
      <div class="mb-5 flex justify-between items-center">
        <div>
          <h2 class="font-extrabold text-xl text-slate-900 tracking-tight">Admin Sign In</h2>
          <p class="text-xs text-slate-500 mt-1">Manage user accounts, balances, and transfer approvals</p>
        </div>
        <a href="index.html" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-extrabold rounded-xl transition-all border border-slate-200 text-center">Client Portal</a>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Admin Passcode</label>
          <input id="adminPassInput" type="password" placeholder="••••••••" class="w-full h-12 border border-slate-200 rounded-xl px-4 text-sm focus:outline-none focus:border-cyan-600 bg-slate-50 text-slate-800">
        </div>
        <button onclick="loginAdmin()" class="w-full h-12 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-cyan-600/20 active:scale-[0.98] transition-all">Access Admin Control Panel</button>
      </div>
    </div>

    <!-- VIEW: ADMIN DASHBOARD -->
    <div id="adminDashboardView" class="hidden bg-slate-50/80 p-4 space-y-4 max-h-[80vh] overflow-y-auto">
      <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200/70 shadow-sm">
        <div>
          <h3 class="font-black text-sm text-slate-900">Admin Control Center</h3>
          <p class="text-[10px] text-slate-400 font-medium">Pending Transfer Requests & User Accounts</p>
        </div>
        <button onclick="logoutAdmin()" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 text-[10px] font-extrabold rounded-xl transition-all">Sign Out</button>
      </div>

      <!-- Pending Transfers List -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200/70 shadow-sm">
        <h4 class="font-extrabold text-xs text-slate-900 uppercase tracking-wider mb-3">Pending Transfers Requiring Approval</h4>
        <div id="adminPendingTransfersList" class="space-y-3 text-xs">
          <p class="text-slate-400 text-center py-4">Loading pending transfers...</p>
        </div>
      </div>

      <!-- All Users Management List -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200/70 shadow-sm">
        <h4 class="font-extrabold text-xs text-slate-900 uppercase tracking-wider mb-3">Registered Client Accounts</h4>
        <div id="adminUsersList" class="space-y-3 text-xs">
          <p class="text-slate-400 text-center py-4">Loading users...</p>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNQiRLu1xSUc1nNcT_mE0u5-EbysO52y0",
      authDomain: "cash-flow-banking3.firebaseapp.com",
      databaseURL: "https://cash-flow-banking3-default-rtdb.firebaseio.com",
      projectId: "cash-flow-banking3",
      storageBucket: "cash-flow-banking3.firebasestorage.app",
      messagingSenderId: "782707432276",
      appId: "1:782707432276:web:680425b777d227179c86c1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alertBox');
      if (!msg) { box.classList.add('hidden'); return; }
      box.className = `p-3.5 rounded-2xl text-xs font-semibold mb-2 text-center border shadow-sm ${
        type === 'error' ? 'bg-rose-50 text-rose-700 border-rose-200' : 
        type === 'warning' ? 'bg-amber-50 text-amber-800 border-amber-200' : 
        'bg-emerald-50 text-emerald-700 border-emerald-200'
      }`;
      box.textContent = msg;
      box.classList.remove('hidden');
    }

    window.loginAdmin = () => {
      const pass = document.getElementById('adminPassInput').value;
      if (pass === 'admin123' || pass === 'ApexAdmin2026') {
        document.getElementById('adminLoginView').classList.add('hidden');
        document.getElementById('adminDashboardView').classList.remove('hidden');
        loadAdminPanel();
      } else {
        showAlert('Incorrect Admin Passcode (Try admin123)');
      }
    };

    window.logoutAdmin = () => {
      document.getElementById('adminDashboardView').classList.add('hidden');
      document.getElementById('adminLoginView').classList.remove('hidden');
      document.getElementById('adminPassInput').value = '';
      showAlert('');
    };

    window.loadAdminPanel = async () => {
      const transListEl = document.getElementById('adminPendingTransfersList');
      const usersListEl = document.getElementById('adminUsersList');
      
      transListEl.innerHTML = `<p class="text-slate-400 text-center py-4">Loading pending transfers...</p>`;
      usersListEl.innerHTML = `<p class="text-slate-400 text-center py-4">Loading users...</p>`;

      try {
        const snap = await getDocs(collection(db, 'cashflow_accounts'));
        let allPending = [];
        let allUsers = [];

        snap.forEach(d => {
          const u = d.id;
          const data = d.data();
          allUsers.push({ id: u, ...data });
          if (data.pendingTransfers && data.pendingTransfers.length > 0) {
            data.pendingTransfers.forEach((p, idx) => {
              allPending.push({ userId: u, userAcc: data.accNo, userName: data.name, ...p, pendingIndex: idx });
            });
          }
        });

        // Render pending transfers
        if (allPending.length === 0) {
          transListEl.innerHTML = `<p class="text-slate-400 text-center py-4">No pending transfers awaiting approval.</p>`;
        } else {
          let html = '';
          allPending.forEach(item => {
            html += `
              <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 flex flex-col gap-2">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-slate-900">${item.userName} (Acc: ${item.userAcc})</span>
                  <span class="font-bold font-mono text-amber-600 text-sm">+$${parseFloat(item.amount).toLocaleString(undefined,{minimumFractionDigits:2})}</span>
                </div>
                <div class="text-[11px] text-slate-500 space-y-0.5">
                  <p><b>To:</b> ${item.recipient} (${item.bank}) • ${item.accNo}</p>
                  <p><b>Type:</b> ${item.type} • <b>Date:</b> ${item.date}</p>
                </div>
                <div class="flex gap-2 pt-1">
                  <button onclick="adminApproveTransfer('${item.userId}', ${item.pendingIndex})" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow-sm">Approve & Send</button>
                  <button onclick="adminRejectTransfer('${item.userId}', ${item.pendingIndex})" class="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-xs shadow-sm">Reject / Refund</button>
                </div>
              </div>`;
          });
          transListEl.innerHTML = html;
        }

        // Render users list
        if (allUsers.length === 0) {
          usersListEl.innerHTML = `<p class="text-slate-400 text-center py-4">No accounts registered.</p>`;
        } else {
          let uHtml = '';
          allUsers.forEach(usr => {
            const checkBal = usr.checkingBalance || usr.balance || 0;
            uHtml += `
              <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 flex flex-col gap-2">
                <div class="flex justify-between items-center">
                  <div>
                    <p class="font-bold text-slate-900">${usr.name} <span class="text-[10px] font-mono text-slate-400">(${usr.accNo})</span></p>
                    <p class="text-[10px] text-slate-500">${usr.email}</p>
                  </div>
                  <span class="px-2 py-0.5 rounded text-[9px] font-extrabold uppercase ${usr.status === 'ACTIVE' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${usr.status || 'PENDING'}</span>
                </div>
                <div class="flex items-center gap-2 pt-1 text-[11px]">
                  <span class="font-mono font-bold text-slate-700">Checking: $${checkBal.toLocaleString(undefined,{minimumFractionDigits:2})}</span>
                </div>
                <div class="flex gap-2 pt-1">
                  <button onclick="adminToggleUserStatus('${usr.id}', '${usr.status === 'ACTIVE' ? 'PENDING' : 'ACTIVE'}')" class="flex-1 py-1.5 bg-slate-900 text-white rounded-xl font-bold text-[10px]">${usr.status === 'ACTIVE' ? 'Suspend / Pending' : 'Approve Account'}</button>
                </div>
              </div>`;
          });
          usersListEl.innerHTML = uHtml;
        }

      } catch (err) {
        transListEl.innerHTML = `<p class="text-rose-500 text-center py-4">Error: ${err.message}</p>`;
      }
    };

    window.adminApproveTransfer = async (userId, pIndex) => {
      try {
        const userRef = doc(db, 'cashflow_accounts', userId);
        const snap = await getDocs(query(collection(db, 'cashflow_accounts'), where('__name__', '==', userId)));
        let uData = null;
        snap.forEach(d => uData = d.data());
        if (!uData) return;

        let pendingList = [...(uData.pendingTransfers || [])];
        const transferToApprove = pendingList.splice(pIndex, 1)[0];
        if (!transferToApprove) return;

        let checkingBal = uData.checkingBalance || uData.balance || 0;
        let savingsBal = uData.savingsBalance || 0;
        let investBal = uData.investmentBalance || 0;

        if (transferToApprove.sourceAcc === 'savings') savingsBal -= transferToApprove.amount;
        else if (transferToApprove.sourceAcc === 'investment') investBal -= transferToApprove.amount;
        else {
          checkingBal -= transferToApprove.amount;
        }

        const historyItem = {
          title: `${transferToApprove.type === 'WIRE' ? 'Wire' : 'Transfer'} to ${transferToApprove.recipient} (${transferToApprove.bank})`,
          amount: transferToApprove.amount,
          date: transferToApprove.date
        };

        const updatedHistory = [...(uData.history || []), historyItem];

        await updateDoc(userRef, {
          pendingTransfers: pendingList,
          history: updatedHistory,
          checkingBalance: checkingBal,
          balance: checkingBal,
          savingsBalance: savingsBal,
          investmentBalance: investBal
        });

        alert('Transfer approved successfully!');
        loadAdminPanel();
      } catch (err) {
        alert('Error approving transfer: ' + err.message);
      }
    };

    window.adminRejectTransfer = async (userId, pIndex) => {
      try {
        const userRef = doc(db, 'cashflow_accounts', userId);
        const snap = await getDocs(query(collection(db, 'cashflow_accounts'), where('__name__', '==', userId)));
        let uData = null;
        snap.forEach(d => uData = d.data());
        if (!uData) return;

        let pendingList = [...(uData.pendingTransfers || [])];
        pendingList.splice(pIndex, 1)[0];

        await updateDoc(userRef, {
          pendingTransfers: pendingList
        });

        alert('Transfer rejected and cleared.');
        loadAdminPanel();
      } catch (err) {
        alert('Error rejecting transfer: ' + err.message);
      }
    };

    window.adminToggleUserStatus = async (userId, newStatus) => {
      try {
        await updateDoc(doc(db, 'cashflow_accounts', userId), { status: newStatus });
        alert('Account status updated to ' + newStatus);
        loadAdminPanel();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
  </script>
</body>
</html>

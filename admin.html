<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN - Cash Flow Banking</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f172a;color:#fff;padding:14px}
.card{background:#fff;color:#0f172a;border-radius:16px;padding:20px;margin-top:16px;max-width:1100px}
input{width:100%;height:44px;padding:0 12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0}
button{height:40px;padding:0 14px;border:0;border-radius:8px;background:#1e4bd8;color:#fff;font-weight:800;cursor:pointer;margin:3px;font-size:12px}
button.green{background:#00b050}button.red{background:#e11d48}button.gray{background:#e2e8f0;color:#111}button.orange{background:#f59e0b;color:#000}
.acc{border:1px solid #e2e8f0;padding:14px;border-radius:12px;margin:8px 0}
.fundBox{background:#f8fafc;border:1px dashed #94a3b8;padding:10px;border-radius:10px;margin-top:8px;display:none}
.tab{padding:10px 16px;border-radius:20px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;font-weight:800;cursor:pointer;margin-right:6px}
.tab.active{background:#0a2540;color:#fff}
</style></head><body>
<h2>🔒 ADMIN PANEL</h2><p style="font-size:11px;color:#94a3b8">PIN: admin123</p>
<div class="card">
<input id="pin" type="password" placeholder="Enter PIN: admin123"><button onclick="unlock()">Unlock</button>
<div id="area" style="display:none;margin-top:16px">
<div style="margin-bottom:12px"><button id="tab1" class="tab active" onclick="showTab('accounts')">Accounts</button><button id="tab2" class="tab" onclick="showTab('transfers')">Pending Transfers <span id="pendCount" style="background:#f59e0b;color:#000;padding:2px 8px;border-radius:10px">0</span></button></div>
<div id="accountsTab">
<div style="display:flex;gap:10px;font-size:12px;margin-bottom:12px;flex-wrap:wrap"><div>Total: <b id="t">0</b></div><div>Pending: <b id="p" style="color:orange">0</b></div><div>Approved: <b id="a" style="color:green">0</b></div><div>Funds: $<b id="tf">0</b></div></div>
<input id="search" placeholder="Search account number e.g 9030189563..." onkeyup="filterList()"><div id="list"></div>
</div>
<div id="transfersTab" style="display:none"><div id="transferList"></div></div>
<button class="gray" onclick="loadAll()">Refresh</button>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCNQiRLu1xSUc1nNcT_mE0u5-EbysO52y0",authDomain:"cash-flow-banking3.firebaseapp.com",projectId:"cash-flow-banking3",storageBucket:"cash-flow-banking3.firebasestorage.app",messagingSenderId:"782707432276",appId:"1:782707432276:web:680425b777d227179c86c1"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
let allDocs=[],allTransfers=[];
window.unlock=()=>{if(pin.value!=='admin123')return alert('Wrong PIN');area.style.display='block';loadAll();}
window.showTab=t=>{accountsTab.style.display=t=='accounts'?'block':'none';transfersTab.style.display=t=='transfers'?'block':'none';tab1.classList.toggle('active',t=='accounts');tab2.classList.toggle('active',t=='transfers');}
window.loadAll=async()=>{await loadAccounts();await loadTransfers();}
async function loadAccounts(){const s=await getDocs(collection(db,'cashflow_accounts'));allDocs=s.docs;renderAccounts(allDocs)}
function renderAccounts(docs){let totalFunds=0,pend=0,appr=0;docs.forEach(d=>{totalFunds+=d.data().balance||0;if(d.data().status=='PENDING')pend++;if(d.data().status=='APPROVED')appr++;});t.textContent=docs.length;p.textContent=pend;a.textContent=appr;tf.textContent=totalFunds.toLocaleString();let h='';docs.sort((x,y)=>y.data().created-x.data().created).forEach(d=>{const c=d.data();h+=`<div class="acc"><div><b>${c.name}</b> - <small>${c.email}</small><br><small><b>Acc: ${c.accNo}</b> | Bal: <b style="color:#1e4bd8">$${c.balance}</b> | ${c.status}</small></div><div style="margin-top:6px">${c.status=='PENDING'?`<button class="green" onclick="appv('${d.id}')">Approve</button><button class="red" onclick="dec('${d.id}')">Decline</button>`:`<button class="orange" onclick="toggleFund('${d.id}')">💰 Fund</button><button class="gray" onclick="del('${d.id}')">Delete</button>`}<div id="fund-${d.id}" class="fundBox"><input id="amt-${d.id}" type="number" placeholder="Amount"><input id="desc-${d.id}" placeholder="Desc"><button class="green" onclick="fundAcc('${d.id}')">Add Funds</button></div></div></div>`});list.innerHTML=h||'No users';}
async function loadTransfers(){const q=query(collection(db,'cashflow_transfers'),where('status','==','PENDING'));const s=await getDocs(q);allTransfers=s.docs;pendCount.textContent=allTransfers.length;let h='';if(s.empty){h='<p style="color:#64748b">No pending transfers</p>';}else{s.docs.forEach(d=>{const t=d.data();h+=`<div class="acc" style="border-left:4px solid #f59e0b"><div><b>${t.fromName} (${t.fromAcc})</b> → $${t.amount}<br><small>To: ${t.toName} | ${t.toBank} | ${t.toAcc}<br>${t.desc} | ${new Date(t.created).toLocaleString()}</small></div><div style="margin-top:8px"><button class="green" onclick="approveTransfer('${d.id}')">✅ Approve & Deduct</button><button class="red" onclick="declineTransfer('${d.id}')">❌ Decline</button></div></div>`;});}transferList.innerHTML=h;}
window.toggleFund=id=>{const el=document.getElementById('fund-'+id);el.style.display=el.style.display=='block'?'none':'block';}
window.fundAcc=async id=>{
const a=parseFloat(document.getElementById('amt-'+id).value);
const desc=document.getElementById('desc-'+id).value||'Admin Funding';
if(!a||a<=0)return alert('Enter amount');
const target=allDocs.find(d=>d.id===id);
const newBal=(target.data().balance||0)+a;
const newHist=[...(target.data().history||[]),{date:Date.now(),desc:desc,amount:a,type:'credit',status:'APPROVED',balanceAfter:newBal}];
await updateDoc(doc(db,'cashflow_accounts',id),{balance:newBal,history:newHist});
alert('Funded $'+a);loadAll();
}
function tDocData(id){const d=allTransfers.find(x=>x.id===id);return d?d.data():null;}
window.approveTransfer=async tid=>{
if(!confirm('Approve? Balance go deduct'))return;
const t=tDocData(tid);
const fromSnap=await getDocs(query(collection(db,'cashflow_accounts'),where('accNo','==',t.fromAcc)));
if(fromSnap.empty)return alert('Sender not found');
const fromDoc=fromSnap.docs[0];
const fromData=fromDoc.data();
if(fromData.balance < t.amount)return alert('Insufficient balance!');
const newBal=fromData.balance - t.amount;
let hist=fromData.history||[];
for(let i=hist.length-1;i>=0;i--){if(hist[i].status=='PENDING' && hist[i].amount==t.amount){hist[i]={...hist[i],status:'APPROVED',balanceAfter:newBal};break;}}
await updateDoc(doc(db,'cashflow_accounts',fromDoc.id),{balance:newBal,history:hist});
await updateDoc(doc(db,'cashflow_transfers',tid),{status:'APPROVED'});
alert('Approved! New bal $'+newBal);loadAll();
}
window.declineTransfer=async tid=>{
if(!confirm('Decline?'))return;
const t=tDocData(tid);
const fromSnap=await getDocs(query(collection(db,'cashflow_accounts'),where('accNo','==',t.fromAcc)));
if(!fromSnap.empty){
const fromDoc=fromSnap.docs[0];
let hist=fromDoc.data().history||[];
for(let i=hist.length-1;i>=0;i--){if(hist[i].status=='PENDING' && hist[i].amount==t.amount){hist[i]={...hist[i],status:'DECLINED',balanceAfter:fromDoc.data().balance};break;}}
await updateDoc(doc(db,'cashflow_accounts',fromDoc.id),{history:hist});
}
await updateDoc(doc(db,'cashflow_transfers',tid),{status:'DECLINED'});
alert('Declined');loadAll();
}
window.filterList=()=>{const q=search.value.toLowerCase();const filtered=allDocs.filter(d=>{const c=d.data();return c.name.toLowerCase().includes(q)||c.email.toLowerCase().includes(q)||c.accNo.toLowerCase().includes(q)});renderAccounts(filtered);}
window.appv=async id=>{await updateDoc(doc(db,'cashflow_accounts',id),{status:'APPROVED'});loadAll();}
window.dec=async id=>{await updateDoc(doc(db,'cashflow_accounts',id),{status:'DECLINED'});loadAll();}
window.del=async id=>{if(confirm('Delete?')){await deleteDoc(doc(db,'cashflow_accounts',id));loadAll();}}
</script></body></html>
